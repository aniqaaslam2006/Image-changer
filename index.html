<!DOCTYPE html>
<html>

<head>
    <title>Image Changer</title>

</head>
<style>
    body {
        background: #e0f2fe;
        font-family: Arial;
        text-align: center;
        padding-top: 80px;
    }

    .container {
        background: white;
        padding: 30px;
        width: 400px;
        margin: auto;
        border-radius: 15px;
    }

    img {
        width: 300px;
        height: 250px;
        object-fit: cover;
        border-radius: 10px;
    }

    button {
        background: blue;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
</style>

<body>

    <div class="container">

        <h1>Image Changer</h1>

        <img id="myImage" src="image 1.jpg" width="300">

        <br><br>

        <button onclick="changeImage()">
            Change Image
        </button>

    </div>

    <script>
        let images = [
            "image 1.jpg",
            "image 2.jpg",
            "image 3.jpg"
        ];

        let index = 0;

        function changeImage() {

            index++;

            if (index >= images.length) {
                index = 0;
            }

            document.getElementById("myImage").src =
                images[index];

        }
    </script>
</body>

</html>
